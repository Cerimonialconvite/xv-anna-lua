<style>
  :root{ --magenta:#b81452; --magenta-esc:#8f0d3f; --rosa:#f8ccca; --rosa-claro:#fde6e3; --ouro:#f2bf87; --ouro-esc:#d9955c; --ouro-claro:#ffe2bd; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--magenta-esc);height:100%}
  body{font-family:"Cormorant Garamond",Georgia,serif;color:var(--rosa-claro);-webkit-tap-highlight-color:transparent;overflow:hidden}

  /* ---------- capa e vídeo ---------- */
  .tela{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--magenta);z-index:10;transition:opacity .6s ease}
  .tela.oculta{opacity:0;pointer-events:none}
  .quadro{position:relative;height:100%;width:100%;max-width:calc(100vh * 9 / 16);max-height:calc(100vw * 16 / 9);overflow:hidden}
  .quadro img,.quadro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .fundo{position:absolute;inset:-60px;background:url(img/capa.jpg) center/cover;filter:blur(28px) saturate(.9);opacity:.9}
  #capa{cursor:pointer}
  #capa .toque{position:absolute;left:50%;bottom:calc(7% + env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 22px;border:1px solid rgba(242,191,135,.6);border-radius:40px;background:rgba(143,13,63,.35);color:var(--ouro-claro);font:500 15px "Cormorant Garamond",serif;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;animation:pulso 2.2s ease-in-out infinite}
  #capa .selo{position:absolute;left:50%;top:49.2%;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;animation:pulsoSelo 2.2s ease-in-out infinite}
  @keyframes pulsoSelo{0%,100%{box-shadow:0 0 0 0 rgba(255,226,189,0)}50%{box-shadow:0 0 30px 8px rgba(255,226,189,.45)}}
  @keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(242,191,135,0)}50%{box-shadow:0 0 26px 4px rgba(242,191,135,.35)}}
  #pular{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:8px 14px;border:1px solid rgba(242,191,135,.6);border-radius:30px;background:rgba(143,13,63,.45);color:var(--ouro-claro);font:500 15px "Cormorant Garamond",serif;letter-spacing:.08em;opacity:0;transition:opacity .6s;z-index:2}
  #animacao.mostra-pular #pular{opacity:1}
  #brilho{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#fffaf2 0%,#fff1dc 55%,#f8dcb8 100%);opacity:0;pointer-events:none;z-index:20;transition:opacity 1s ease}
  #brilho.saindo{transition:opacity 1.6s ease}

  /* ---------- livro ---------- */
  #convite{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#c4185a 0%,#8f0d3f 100%);opacity:0;transition:opacity .6s ease;overflow:hidden}
  #convite.visivel{opacity:1}
  #palco{width:min(100vw,calc((100vh - 110px) * 9 / 16));aspect-ratio:1080/1920;position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;margin-bottom:40px;box-shadow:0 18px 50px rgba(60,0,25,.45)}
  .folha{position:absolute;inset:0;pointer-events:none}
  .folha>.pagina{pointer-events:auto}
  .pagina{position:absolute;inset:0;background:var(--magenta);container-type:inline-size;overflow:hidden}
  .pagina>img.pg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
  .sombra{position:absolute;left:0;top:0;pointer-events:none;display:none}
  .verso{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;display:none;filter:drop-shadow(0 0 10px rgba(60,0,25,.3))}
  .verso-in{background-color:#f6d3d0}

  .ponto{position:absolute;width:17.6%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;display:block;z-index:3}
  .ponto:focus-visible{outline:2px solid var(--ouro);outline-offset:4px}
  .ponto::after{content:"";position:absolute;inset:0;border-radius:50%;animation:pulsoIcone 2.4s ease-in-out infinite}
  @keyframes pulsoIcone{0%,100%{box-shadow:0 0 0 0 rgba(255,226,189,.6)}60%{box-shadow:0 0 0 14px rgba(255,226,189,0)}}

  /* ---------- contagem (página 3) ---------- */
  .cartao{position:absolute;left:12%;right:12%;top:50%;transform:translateY(-50%);padding:9cqw 5cqw 8cqw;text-align:center;
    background:linear-gradient(160deg,rgba(196,24,88,.95),rgba(150,12,64,.95));border-radius:3cqw;box-shadow:0 2cqw 6cqw rgba(120,10,50,.28)}
  .cartao::before{content:"";position:absolute;inset:2cqw;border:1px solid rgba(242,191,135,.55);border-radius:1.6cqw;pointer-events:none}
  .ouro{background:linear-gradient(180deg,var(--ouro-claro) 0%,var(--ouro) 45%,var(--ouro-esc) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .cartao h2{font-weight:400;font-style:italic;font-size:12.5cqw;line-height:1}
  .cartao .sub{margin-top:1.6cqw;font-size:3.4cqw;letter-spacing:.3em;text-transform:uppercase;color:var(--rosa)}
  .relogio{display:flex;justify-content:center;align-items:flex-start;margin-top:6cqw}
  .unidade{flex:1;min-width:0}
  .unidade+.unidade{border-left:1px solid rgba(242,191,135,.45)}
  .unidade b{display:block;font-weight:500;font-size:11.5cqw;line-height:1;font-variant-numeric:lining-nums tabular-nums}
  .unidade small{display:block;margin-top:2cqw;font-size:2.9cqw;letter-spacing:.22em;text-transform:uppercase;color:var(--rosa)}
  .orn{display:flex;align-items:center;justify-content:center;gap:2.4cqw;margin-top:6cqw;color:var(--ouro)}
  .orn i{display:block;height:1px;width:13cqw;background:linear-gradient(90deg,transparent,var(--ouro))}
  .orn i:last-child{transform:scaleX(-1)}
  .orn span{font-size:3.6cqw;letter-spacing:.25em}
  .chegou{display:none;margin-top:6cqw;font-style:italic;font-size:9cqw}
  .cartao>*{opacity:0;transform:translateY(4cqw);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
  .revelada .cartao>*{opacity:1;transform:none}
  .revelada .cartao .sub{transition-delay:.3s} .revelada .cartao .relogio{transition-delay:.6s} .revelada .cartao .orn{transition-delay:.9s}
  .faiscas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

  /* ---------- navegação ---------- */
  .dica{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:10px;padding:9px 18px;border-radius:30px;background:rgba(143,13,63,.85);border:1px solid rgba(242,191,135,.5);color:var(--ouro-claro);font:500 14px "Cormorant Garamond",serif;letter-spacing:.1em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
  .dica.mostra{opacity:1}
  .dica svg{width:22px;height:22px;fill:none;stroke:var(--ouro-claro);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:arrasta 1.6s ease-in-out infinite}
  @keyframes arrasta{0%,100%{transform:translateX(8px)}50%{transform:translateX(-8px)}}
  .pontos{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:flex;gap:9px;opacity:0;transition:opacity .6s}
  .pontos.mostra{opacity:1}
  .pontos i{width:8px;height:8px;border-radius:50%;background:rgba(255,226,189,.3);transition:background .3s,transform .3s}
  .pontos i.ativo{background:var(--ouro);transform:scale(1.25)}
  .seta{position:fixed;top:50%;z-index:8;width:40px;height:40px;margin-top:-40px;border-radius:50%;border:1px solid rgba(242,191,135,.5);background:rgba(143,13,63,.7);display:none;align-items:center;justify-content:center;cursor:pointer}
  .seta svg{width:18px;height:18px;fill:none;stroke:var(--ouro-claro);stroke-width:1.8}
  @media (min-width:700px){ .seta{display:flex} }
  #ant{left:calc(50% - min(50vw, calc((100vh - 110px) * 9 / 32)) - 56px)} #prox{right:calc(50% - min(50vw, calc((100vh - 110px) * 9 / 32)) - 56px)}

  #poeira{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  .aviso{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:rgba(143,13,63,.95);border:1px solid rgba(242,191,135,.5);color:var(--ouro-claro);font:500 15px "Cormorant Garamond",serif;letter-spacing:.06em;padding:10px 16px;border-radius:24px;opacity:0;transition:opacity .4s,transform .4s;z-index:40;pointer-events:none;white-space:nowrap}
  .aviso.mostra{opacity:1;transform:translate(-50%,0)}
  .janela{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(60,0,25,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
  .janela.aberta{opacity:1;pointer-events:auto}
  .caixa{width:min(100%,520px);height:min(86vh,760px);display:flex;flex-direction:column;background:#fdf1ef;border:1px solid rgba(242,191,135,.7);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(40,0,15,.5);transform:translateY(16px);transition:transform .35s}
  .janela.aberta .caixa{transform:none}
  .caixa header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 12px 18px;background:linear-gradient(160deg,#c4185a,#960c40);color:var(--ouro-claro);font:500 19px "Cormorant Garamond",serif;letter-spacing:.06em}
  .caixa header button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(242,191,135,.6);background:transparent;color:var(--ouro-claro);font-size:20px;line-height:1;cursor:pointer}
  .caixa iframe{flex:1;width:100%;border:0;background:#fff}
  .caixa footer{display:none;padding:10px;background:#fdf1ef;text-align:center}
  .caixa footer.mostra{display:block}
  .caixa footer a{display:inline-block;padding:9px 18px;border-radius:30px;background:#b81452;color:var(--ouro-claro);font:500 15px "Cormorant Garamond",serif;letter-spacing:.06em;text-decoration:none}
  #som{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid rgba(242,191,135,.6);background:rgba(143,13,63,.8);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(60,0,20,.3)}
  #som.ativo{display:flex}
  #som svg{width:22px;height:22px;fill:none;stroke:var(--ouro);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  #som .off{display:none} #som.mudo .on{display:none} #som.mudo .off{display:block}
</style>
</head>
<body>
<div id="capa" class="tela" role="button" aria-label="Toque para abrir o convite" tabindex="0">
  <div class="fundo"></div>
  <div class="quadro"><img src="img/capa.jpg" alt="Convite XV anos de Anna Lua — toque para abrir"><div class="selo"></div><div class="toque">Toque para abrir</div></div>
</div>
<div id="animacao" class="tela oculta">
  <div class="fundo"></div>
  <div class="quadro">
    <video id="video" poster="img/poster.jpg" muted playsinline preload="auto"></video>
    <button id="pular" type="button">Pular ›</button>
  </div>
</div>
<div id="brilho"></div>
<audio id="musica" preload="auto" loop></audio>
<button id="som" type="button" aria-label="Pausar música">
  <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
  <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 10l4 4M21 10l-4 4"/></svg>
</button>
<div class="aviso" id="aviso">Confirmação disponível em breve</div>
<div class="janela" id="janela" role="dialog" aria-modal="true" aria-labelledby="janela-titulo">
  <div class="caixa">
    <header><span id="janela-titulo"></span><button type="button" id="fechar" aria-label="Fechar">×</button></header>
    <iframe id="janela-frame" title="" loading="lazy" allow="geolocation"></iframe>
    <footer id="janela-rodape"><a id="janela-externo" target="_blank" rel="noopener">Abrir no app de mapas</a></footer>
  </div>
</div>

<main id="convite" hidden>
 <div id="palco">
  <div class="pagina"><img class="pg" src="img/p1.jpg" alt="Monograma AL. Há uma beleza singular nos começos, quando tudo ainda é sonho e o futuro inteiro está por florescer."></div>
  <div class="pagina"><img class="pg" src="img/p2.jpg" alt="Anna Lua. Momentos especiais merecem ser compartilhados com pessoas especiais. Por isso, convido você a celebrar comigo meus XV anos. 21 de novembro de 2026, às 21 horas."></div>
  <div class="pagina" id="pg-contagem"><img class="pg" src="img/p3.jpg" alt="">
    <section class="cartao" aria-label="Contagem regressiva">
      <h2 class="ouro">Faltam</h2>
      <p class="sub">para o grande dia</p>
      <div class="relogio" id="relogio">
        <div class="unidade"><b class="ouro" id="d">--</b><small>dias</small></div>
        <div class="unidade"><b class="ouro" id="h">--</b><small>horas</small></div>
        <div class="unidade"><b class="ouro" id="m">--</b><small>min</small></div>
        <div class="unidade"><b class="ouro" id="s">--</b><small>seg</small></div>
      </div>
      <div class="chegou ouro" id="chegou">Chegou o grande dia!</div>
      <div class="orn"><i></i><span>21 · 11 · 26</span><i></i></div>
    </section>
  </div>
  <div class="pagina"><img class="pg" src="img/p4.jpg" alt="Dress code: esporte fino. Com carinho, pedimos que o rosa fique reservado para a debutante."></div>
  <div class="pagina"><img class="pg" src="img/p5.jpg" alt="Localização: Espaço Felicità, R. Fernando José Guimarães Rocha, 123 - Imbuí, Salvador - BA, 41741-090."></div>
  <div class="pagina"><img class="pg" src="img/p6.jpg" alt="Manual do convidado: atente-se ao horário descrito no convite; chegue na hora para poder aproveitar cada momento da festa. Teremos um dia incrível, de muita alegria e diversão; capriche no look para a festa! Confirme sua presença até 04 de novembro de 2026 para garantir que seu nome esteja na lista de convidados. Cada pessoa convidada faz parte da minha história; caso não possa comparecer, por favor, nos informe. Obrigada!"></div>
  <div class="pagina"><img class="pg" src="img/p7.jpg" alt="Lista de presentes. O que eu amaria ganhar: body splash e perfume, hidratante, make, itens de cabelo, acessórios, bolsas, berloque Vivara, blusas tamanho P, short tamanho 38, calça tamanho 40, calçado 40/41. Minhas marcas favoritas: C&amp;A, Centauro, Farm, Florenza, O Boticário, Prata e Prata, Renner, Romanel, Sephora, Victoria's Secret, Vivara, Youcom."></div>
  <div class="pagina"><img class="pg" src="img/p8.jpg" alt="Clique nos ícones para interagir: localização, confirme sua presença e lista de presentes.">
    <a class="ponto" id="p-mapa" style="left:21.3%;top:82.8%" target="_blank" rel="noopener" aria-label="Abrir localização no mapa"
       href="https://www.google.com/maps?cid=4821349465897848643"></a>
    <a class="ponto" id="p-rsvp" style="left:50%;top:82.8%" target="_blank" rel="noopener" aria-label="Confirmar presença" href="#"></a>
    <a class="ponto" id="p-lista" style="left:78.7%;top:82.8%" aria-label="Ver lista de presentes" href="#"></a>
  </div>
 </div>
</main>
<div class="dica" id="dica"><svg viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5"/></svg>Puxe o canto para virar a página</div>
<div class="pontos" id="pontos"><i class="ativo"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<button class="seta" id="ant" type="button" aria-label="Página anterior"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
<button class="seta" id="prox" type="button" aria-label="Próxima página"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
<canvas id="poeira" aria-hidden="true"></canvas>
<script>
(function(){
  /* ===== AJUSTES ===== */
  var LINK_CONFIRMACAO = 'https://docs.google.com/forms/d/e/1FAIpQLSfKXNIjfvKZwhJIZP31nuH0ZPSnxucqoed2ILYdfT7lA4wCEQ/viewform';                        // cole aqui o link de confirmação de presença
  var VIDEO  = 'animacao.mp4';
  var MUSICA = 'musica.mp3';                              // 'musica.mp3' quando a música chegar
  var DATA_EVENTO = '2026-11-21T21:00:00-03:00';    // 21/11/2026 às 21h

  var capa=document.getElementById('capa'), anim=document.getElementById('animacao'),
      video=document.getElementById('video'), brilho=document.getElementById('brilho'),
      convite=document.getElementById('convite'), musica=document.getElementById('musica'),
      som=document.getElementById('som'), aberto=false, terminou=false;
  var semMovimento=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(VIDEO){ video.src=VIDEO; try{ video.load(); }catch(e){} } else { anim.remove(); anim=null; video=null; }
  if(MUSICA){ musica.src=MUSICA; } else { musica.remove(); som.remove(); musica=null; som=null; }

  /* ---------- confirmação ---------- */
  var rsvp=document.getElementById('p-rsvp'), aviso=document.getElementById('aviso');
  if(LINK_CONFIRMACAO){ rsvp.href=LINK_CONFIRMACAO; }
  else rsvp.addEventListener('click',function(e){ e.preventDefault(); aviso.classList.add('mostra'); setTimeout(function(){ aviso.classList.remove('mostra'); },2600); });

  /* ---------- música ---------- */
  function fadeIn(){ musica.volume=0; var v=0; var t=setInterval(function(){ v+=0.05; musica.volume=Math.min(v,0.85); if(v>=0.85) clearInterval(t); },150); }
  function tocar(){
    if(!musica) return;
    var p=musica.play();
    if(p&&p.then) p.then(function(){ som.classList.add('ativo'); fadeIn(); }).catch(function(){ som.classList.add('ativo','mudo'); });
    else som.classList.add('ativo');
  }
  var pausadoPeloUsuario=false, saiuPorLink=false;
  if(som) som.addEventListener('click',function(){
    if(musica.paused){ pausadoPeloUsuario=false; musica.play(); som.classList.remove('mudo'); som.setAttribute('aria-label','Pausar música'); }
    else { pausadoPeloUsuario=true; musica.pause(); som.classList.add('mudo'); som.setAttribute('aria-label','Tocar música'); }
  });
  /* mapa e confirmação: a música continua; se o celular pausar, volta sozinha ao retornar */
  document.querySelectorAll('.ponto').forEach(function(p){ p.addEventListener('click',function(){ if(p.getAttribute('href')!=='#') saiuPorLink=true; }); });
  function retomar(){
    if(!musica||!aberto||pausadoPeloUsuario||!musica.paused) return;
    var p=musica.play();
    if(p&&p.catch) p.catch(function(){
      var umToque=function(){ document.removeEventListener('pointerdown',umToque,true); if(!pausadoPeloUsuario) musica.play(); };
      document.addEventListener('pointerdown',umToque,true);
    });
  }
  document.addEventListener('visibilitychange',function(){
    if(!musica) return;
    if(document.hidden){ if(!saiuPorLink && !musica.paused) musica.pause(); }
    else { saiuPorLink=false; retomar(); }
  });
  window.addEventListener('pageshow',retomar);
  window.addEventListener('focus',function(){ saiuPorLink=false; retomar(); });


  /* ---------- mapa e confirmação abrem dentro do convite (a música não para) ---------- */
  var MAPA_APP='https://www.google.com/maps?cid=4821349465897848643';
  var janela=document.getElementById('janela'), jf=document.getElementById('janela-frame'), jt=document.getElementById('janela-titulo'),
      jr=document.getElementById('janela-rodape'), jx=document.getElementById('janela-externo');
  function abrirJanela(titulo,src,externo){
    jt.textContent=titulo; jf.title=titulo; jf.src=src;
    if(externo){ jx.href=externo; jr.classList.add('mostra'); } else jr.classList.remove('mostra');
    janela.classList.add('aberta');
  }
  function fecharJanela(){ janela.classList.remove('aberta'); setTimeout(function(){ jf.src='about:blank'; },400); }
  document.getElementById('fechar').addEventListener('click',fecharJanela);
  janela.addEventListener('click',function(e){ if(e.target===janela) fecharJanela(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') fecharJanela(); });
  if(LINK_CONFIRMACAO) rsvp.addEventListener('click',function(e){ e.preventDefault(); abrirJanela('Confirme sua presença',LINK_CONFIRMACAO+(LINK_CONFIRMACAO.indexOf('?')<0?'?':'&')+'embedded=true'); });
  jx.addEventListener('click',function(){ saiuPorLink=true; });

  /* ---------- abertura ---------- */
  function abrir(){
    if(aberto) return; aberto=true;
    tocar();
    if(!video){ mostrarConvite(); return; }
    anim.classList.remove('oculta'); capa.classList.add('oculta');
    var p=video.play(); if(p&&p.catch) p.catch(function(){ mostrarConvite(); });
    setTimeout(function(){ anim.classList.add('mostra-pular'); },1500);
    setTimeout(mostrarConvite,12000);
  }
  function mostrarConvite(){
    if(terminou) return; terminou=true;
    brilho.style.opacity='1';
    setTimeout(function(){
      convite.hidden=false;
      if(anim){ anim.classList.add('oculta'); try{ video.pause(); }catch(e){} }
      convite.classList.add('visivel');
      setTimeout(function(){ brilho.classList.add('saindo'); brilho.style.opacity='0'; iniciarLivro(); iniciarPoeira(); mostrarDica(); },350);
      setTimeout(function(){ capa.remove(); if(anim) anim.remove(); },2200);
    },900);
  }
  capa.addEventListener('click',abrir);
  capa.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrir(); } });
  if(video){ video.addEventListener('ended',mostrarConvite); video.addEventListener('timeupdate',function(){ if(video.duration && video.currentTime>=video.duration-0.45) mostrarConvite(); }); document.getElementById('pular').addEventListener('click',mostrarConvite); }

  var dica=document.getElementById('dica'), dicaFeita=false;
  function mostrarDica(){ setTimeout(function(){ if(!dicaFeita) dica.classList.add('mostra'); },1200); }
  function esconderDica(){ dicaFeita=true; dica.classList.remove('mostra'); }

  /* ---------- livro: língua no canto, puxar na diagonal ---------- */
  var vistas={}, palco=document.getElementById('palco'), folhas=[], atual=0, W=0, H=0, arrasto=null, animando=false;
  function v(x,y){ return {x:x,y:y}; }
  function reflete(p,m,d){ var px=p.x-m.x, py=p.y-m.y, k=px*d.x+py*d.y; return v(m.x+2*k*d.x-px, m.y+2*k*d.y-py); }
  // fold definido pelo ponto P (onde está o canto inferior direito C)
  function geometria(P){
    var C=v(W,H), dx=C.x-P.x, dy=C.y-P.y, L=Math.hypot(dx,dy);
    if(L<0.5) return null;
    var n=v(dx/L,dy/L), M=v((C.x+P.x)/2,(C.y+P.y)/2);
    return {n:n,M:M,d:v(-n.y,n.x),dist:L/2};
  }
  function corta(poly,g,ladoC){ // Sutherland-Hodgman com semiplano
    var out=[], f=function(p){ var s=(p.x-g.M.x)*g.n.x+(p.y-g.M.y)*g.n.y; return ladoC?s:-s; };
    for(var i=0;i<poly.length;i++){
      var a=poly[i], b=poly[(i+1)%poly.length], fa=f(a), fb=f(b);
      if(fa>=0) out.push(a);
      if((fa>=0)!==(fb>=0)){ var t=fa/(fa-fb); out.push(v(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t)); }
    }
    return out;
  }
  function poligono(p){ return p.length<3?'polygon(0 0,0 0,0 0)':'polygon('+p.map(function(q){ return q.x.toFixed(1)+'px '+q.y.toFixed(1)+'px'; }).join(',')+')'; }
  function gradiente(g,stops){ // gradiente ao longo de n, posições em px a partir da linha da dobra
    var ang=Math.atan2(g.n.x,-g.n.y)*180/Math.PI, Lg=Math.abs(W*g.n.x)+Math.abs(H*g.n.y);
    var s0=(g.M.x-W/2)*g.n.x+(g.M.y-H/2)*g.n.y+Lg/2;
    return 'linear-gradient('+ang.toFixed(2)+'deg,'+stops.map(function(s){ return s[0]+' '+(s0+s[1]).toFixed(1)+'px'; }).join(',')+')';
  }
  function linhaPorDoisPontos(A,B){ // devolve P = reflexo de C pela reta AB
    var L=Math.hypot(B.x-A.x,B.y-A.y), d=v((B.x-A.x)/L,(B.y-A.y)/L);
    return reflete(v(W,H),A,d);
  }
  function restoDireita(j,k){ return linhaPorDoisPontos(v(W-j,H),v(W,H-k)); }
  function restoEsquerda(j,k){ return linhaPorDoisPontos(v(0,H-k),v(j,H)); }
  var VIRADA=function(){ return v(-W,H); };

  function desenha(f){
    var P=f.P, el=f.el, g=geometria(P), ret=[v(0,0),v(W,0),v(W,H),v(0,H)];
    if(!g){ f.frente.style.clipPath='none'; f.verso.style.display='none'; f.sombra.style.display='none'; el.style.visibility='visible'; return; }
    var frente=corta(ret,g,false);
    if(frente.length<3 && P.x<=-W+1){ el.style.visibility='hidden'; return; }
    el.style.visibility='visible';
    f.frente.style.clipPath=f.frente.style.webkitClipPath=poligono(frente);
    var dobra=corta(ret,g,true);
    // verso: região dobrada refletida pela linha
    var d=g.d, a=d.x*d.x-d.y*d.y, b=2*d.x*d.y, c=b, dd=d.y*d.y-d.x*d.x;
    var e=g.M.x-(a*g.M.x+c*g.M.y), ff=g.M.y-(b*g.M.x+dd*g.M.y);
    f.verso.style.display='block';
    f.verso.style.transform='matrix('+a+','+b+','+c+','+dd+','+e+','+ff+')';
    f.versoIn.style.clipPath=f.versoIn.style.webkitClipPath=poligono(dobra);
    f.versoIn.style.backgroundImage=gradiente(g,[['rgba(90,10,40,.18)',0],['rgba(255,255,255,0)',Math.min(70,g.dist*.5)],['rgba(255,255,255,.35)',g.dist*1.2]]);
    // sombra sobre a página de baixo
    f.sombra.style.display='block';
    f.sombra.style.clipPath=f.sombra.style.webkitClipPath=poligono(dobra);
    f.sombra.style.backgroundImage=gradiente(g,[['rgba(70,0,30,.26)',0],['rgba(70,0,30,0)',Math.min(110,g.dist*.9)]]);
  }
  function ordem(){
    folhas.forEach(function(f,i){ f.el.style.zIndex = i<atual ? 100+i : 50-i; });
  }
  // ---------- estados de repouso + língua mexendo ----------
  var t0=performance.now();
  function lingua(t,ladoEsq){
    var ciclo=((t-t0)/1000+(ladoEsq?1.3:0))%3.2, amp=0;
    if(ciclo<1.1) amp=Math.sin(ciclo/1.1*Math.PI);
    var j=W*(0.12+0.06*amp), k=W*(0.15+0.07*amp);
    return ladoEsq? restoEsquerda(j*0.9,k*0.9) : restoDireita(j,k);
  }
  function quadro(t){
    if(!arrasto && !animando){
      var cur=folhas[atual], ant=folhas[atual-1];
      if(cur && atual<folhas.length-1){ cur.P=lingua(t,false); desenha(cur); }
      if(ant){ ant.P=lingua(t,true); desenha(ant); }
    }
    requestAnimationFrame(quadro);
  }
  // ---------- animação até um alvo ----------
  function animar(f,alvo,dur,arco,fim){
    animando=true; var de=v(f.P.x,f.P.y), ini=performance.now();
    (function passo(t){
      var p=Math.min(1,(t-ini)/dur), e=1-Math.pow(1-p,3);
      f.P=v(de.x+(alvo.x-de.x)*e, de.y+(alvo.y-de.y)*e - Math.sin(Math.PI*e)*arco);
      desenha(f);
      if(p<1) requestAnimationFrame(passo); else { animando=false; if(fim) fim(); }
    })(ini);
  }
  function irPara(n){
    atual=n; ordem();
    folhas.forEach(function(f,i){ if(i<atual-1){ f.P=VIRADA(); desenha(f); } else if(i>atual){ f.P=v(W,H); desenha(f); } });
    document.querySelectorAll('#pontos i').forEach(function(p,k){ p.classList.toggle('ativo',k===atual); });
    if(atual===2) revelarContagem();
    if(n>0) esconderDica();
    if(!vistas[atual]){ vistas[atual]=true; faiscas(folhas[atual].frente); }
  }
  function proxima(){ if(animando||atual>=folhas.length-1) return; var f=folhas[atual]; animar(f,VIRADA(),850,H*0.18,function(){ irPara(atual+1); }); }
  function anterior(){ if(animando||atual<=0) return; var f=folhas[atual-1]; animar(f,v(W,H),850,H*0.18,function(){ irPara(atual-1); }); }
  document.getElementById('p-lista').addEventListener('click',function(e){ e.preventDefault(); anterior(); });
  // ---------- arrastar ----------
  function local(e){ var r=palco.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return v(t.clientX-r.left,t.clientY-r.top); }
  function limita(P){
    var hb=v(0,H), dx=P.x-hb.x, dy=P.y-hb.y, r=Math.hypot(dx,dy);
    if(r>W){ P=v(hb.x+dx/r*W, hb.y+dy/r*W); }
    var ht=v(0,0), D=Math.hypot(W,H); dx=P.x; dy=P.y; r=Math.hypot(dx,dy);
    if(r>D){ P=v(dx/r*D, dy/r*D); }
    return P;
  }
  function inicio(e){
    if(animando||e.target.closest('.ponto')) return;
    var p=local(e);
    var naDireita = p.x>W*0.62 && p.y>H*0.72 && atual<folhas.length-1;
    var naEsquerda = p.x<W*0.38 && p.y>H*0.72 && atual>0;
    if(!naDireita && !naEsquerda) return;
    arrasto={lado:naDireita?'d':'e', ini:p, t:performance.now(), f:folhas[naDireita?atual:atual-1]};
    if(e.cancelable) e.preventDefault();
    mover(e);
  }
  function mover(e){
    if(!arrasto) return; if(e.cancelable) e.preventDefault();
    var p=local(e), P = arrasto.lado==='d' ? v(p.x,p.y) : v(2*p.x-W, p.y);
    arrasto.f.P=limita(P); arrasto.ult=p; desenha(arrasto.f);
  }
  function solta(){
    if(!arrasto) return; var a=arrasto; arrasto=null;
    var p=a.ult||a.ini, rapido=(performance.now()-a.t)<350;
    if(a.lado==='d'){
      var foi = p.x<W*0.55 || (rapido && a.ini.x-p.x>30) || (performance.now()-a.t<250 && Math.hypot(p.x-a.ini.x,p.y-a.ini.y)<8);
      if(foi) animar(a.f,VIRADA(),600,H*0.1,function(){ irPara(atual+1); });
      else animar(a.f,lingua(performance.now(),false),350,0);
    } else {
      var volta = p.x>W*0.45 || (rapido && p.x-a.ini.x>30) || (performance.now()-a.t<250 && Math.hypot(p.x-a.ini.x,p.y-a.ini.y)<8);
      if(volta) animar(a.f,v(W,H),600,H*0.1,function(){ irPara(atual-1); });
      else animar(a.f,lingua(performance.now(),true),350,0);
    }
  }
  function medidas(){ var r=palco.getBoundingClientRect(); W=r.width; H=r.height; folhas.forEach(function(f){ f.versoIn.style.width=W+'px'; f.versoIn.style.height=H+'px'; f.sombra.style.width=W+'px'; f.sombra.style.height=H+'px'; }); irPara(atual); }
  function iniciarLivro(){
    document.getElementById('pontos').classList.add('mostra');
    [].slice.call(palco.querySelectorAll('.pagina')).forEach(function(pg){
      var el=document.createElement('div'); el.className='folha';
      pg.parentNode.insertBefore(el,pg); pg.classList.add('frente'); el.appendChild(pg);
      var sombra=document.createElement('div'); sombra.className='sombra'; el.appendChild(sombra);
      var verso=document.createElement('div'); verso.className='verso'; var vi=document.createElement('div'); vi.className='verso-in'; verso.appendChild(vi); el.appendChild(verso);
      folhas.push({el:el,frente:pg,verso:verso,versoIn:vi,sombra:sombra,P:v(0,0)});
    });
    medidas(); folhas.forEach(function(f){ f.P=v(W,H); desenha(f); });
    addEventListener('resize',medidas);
    palco.addEventListener('touchstart',inicio,{passive:false}); palco.addEventListener('touchmove',mover,{passive:false}); palco.addEventListener('touchend',solta); palco.addEventListener('touchcancel',solta);
    palco.addEventListener('mousedown',inicio); addEventListener('mousemove',mover); addEventListener('mouseup',solta);
    document.getElementById('ant').addEventListener('click',anterior);
    document.getElementById('prox').addEventListener('click',proxima);
    document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight') proxima(); if(e.key==='ArrowLeft') anterior(); });
    requestAnimationFrame(quadro);
  }
  var contFeita=false;

  var contFeita=false;
  function revelarContagem(){
    if(contFeita) return; contFeita=true;
    var pg=document.getElementById('pg-contagem');
    setTimeout(function(){ pg.classList.add('revelada'); },250);
  }

  /* ---------- brilho dourado a cada página ---------- */
  function faiscas(pg){
    if(semMovimento) return;
    var c=document.createElement('canvas'); c.className='faiscas'; pg.appendChild(c);
    var r=pg.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
    var W=c.width=Math.round(r.width*dpr), H=c.height=Math.round(r.height*dpr), ctx=c.getContext('2d'), ps=[];
    for(var i=0;i<42;i++) ps.push({x:Math.random()*W,y:H*(.15+Math.random()*.85),vy:-(.25+Math.random()*.7)*dpr,vx:(Math.random()-.5)*.35*dpr,
      r:(.8+Math.random()*2.2)*dpr,ini:Math.random()*900,vida:1400+Math.random()*1300,gira:Math.random()*6});
    var t0=null, FIM=2900;
    function quadro(t){
      if(t0===null) t0=t; var dt=t-t0;
      ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation='lighter';
      ps.forEach(function(p){
        var u=(dt-p.ini)/p.vida; if(u<=0||u>=1) return;
        var a=Math.sin(u*Math.PI), x=p.x+p.vx*(dt-p.ini)/16, y=p.y+p.vy*(dt-p.ini)/16;
        var tw=.6+.4*Math.sin(dt/120+p.gira), R=p.r*(1+tw*.4);
        var g=ctx.createRadialGradient(x,y,0,x,y,R*5);
        g.addColorStop(0,'rgba(255,236,200,'+(.95*a*tw)+')'); g.addColorStop(.25,'rgba(246,196,135,'+(.55*a*tw)+')'); g.addColorStop(1,'rgba(240,170,100,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R*5,0,6.283); ctx.fill();
        if(p.r>2*dpr){ ctx.strokeStyle='rgba(255,240,215,'+(.7*a*tw)+')'; ctx.lineWidth=dpr*.7;
          ctx.beginPath(); ctx.moveTo(x-R*4,y); ctx.lineTo(x+R*4,y); ctx.moveTo(x,y-R*4); ctx.lineTo(x,y+R*4); ctx.stroke(); }
      });
      if(dt<FIM) requestAnimationFrame(quadro); else c.remove();
    }
    requestAnimationFrame(quadro);
  }

  /* ---------- poeira dourada flutuando no fundo ---------- */
  function iniciarPoeira(){
    if(semMovimento) return;
    var c=document.getElementById('poeira'), x=c.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1), W, H, lista=[];
    function tam(){ W=innerWidth; H=innerHeight; c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0); }
    tam(); addEventListener('resize',tam);
    function nova(base){ return {x:Math.random()*W,y:base?H+10+Math.random()*H*.5:Math.random()*H,r:.8+Math.random()*1.8,vy:8+Math.random()*16,amp:6+Math.random()*14,fr:.3+Math.random()*.6,fase:Math.random()*6.28,o:Math.random()*6.28,a:.35+Math.random()*.45}; }
    var N=W<600?22:32; for(var i=0;i<N;i++) lista.push(nova(false));
    var ant=null;
    function quadro(t){
      if(ant===null) ant=t; var dt=Math.min(.05,(t-ant)/1000); ant=t;
      x.clearRect(0,0,W,H);
      if(!document.hidden) lista.forEach(function(p,i){
        p.y-=p.vy*dt; p.fase+=p.fr*dt;
        if(p.y<-10) lista[i]=p=nova(true);
        var px=p.x+Math.sin(p.fase)*p.amp, tw=.55+.45*Math.sin(t/400+p.o), R=p.r*4;
        var g=x.createRadialGradient(px,p.y,0,px,p.y,R);
        g.addColorStop(0,'rgba(255,236,200,'+(p.a*tw)+')'); g.addColorStop(.35,'rgba(242,191,135,'+(p.a*tw*.5)+')'); g.addColorStop(1,'rgba(242,191,135,0)');
        x.fillStyle=g; x.beginPath(); x.arc(px,p.y,R,0,6.283); x.fill();
      });
      requestAnimationFrame(quadro);
    }
    requestAnimationFrame(quadro);
  }

  /* ---------- contagem regressiva ---------- */
  var rel=document.getElementById('relogio'), alvo=new Date(DATA_EVENTO).getTime(), dois=function(n){ return (n<10?'0':'')+n; };
  (function atualiza(){
    var r=alvo-Date.now();
    if(r<=0){ rel.style.display='none'; document.getElementById('chegou').style.display='block'; return; }
    var s=Math.floor(r/1000);
    document.getElementById('d').textContent=Math.floor(s/86400);
    document.getElementById('h').textContent=dois(Math.floor(s%86400/3600));
    document.getElementById('m').textContent=dois(Math.floor(s%3600/60));
    document.getElementById('s').textContent=dois(s%60);
    setTimeout(atualiza,1000);
  })();
})();
</script>
